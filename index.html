<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provisioning & Scaling Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Provisioning & Scaling Control Panel</h1>
        
        <div class="card">
            <h2>System Status</h2>
            <p>Instances: <span id="instance-count">Loading...</span></p>
            <p>Status: <span id="system-status">Loading...</span></p>
            <p>Load: <span id="system-load">Loading...</span></p>
        </div>

        <div class="actions">
            <button id="provision-btn">Provision Instance</button>
            <button id="scale-up-btn">Scale Up (+1)</button>
        </div>

        <div id="output"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
